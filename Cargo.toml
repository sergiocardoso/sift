[package]
name = "sift"
version = "0.1.0"
edition = "2021"
authors = ["Sérgio Cardoso"]
description = "Local-first, safe CLI for cleaning and organizing files."
license = "Apache-2.0"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
trash = "5.2"
directories = "5.0"
thiserror = "1.0"
notify = "6"
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.0"

[profile.dev]
incremental = true

[profile.release]
lto = true
