[workspace]
# Root-package workspace: this Cargo.toml is still the `sift` CLI package
# itself (unchanged below), it just also lists `sift-tray` as a second
# member. `cargo build`/`cargo install --path .` here only ever touch the
# `sift` package (no GTK/tao/tray-icon anywhere in its dependency graph);
# only `cargo build -p sift-tray` (or `--workspace`) pulls those in.
members = ["sift-tray"]

[package]
name = "sift"
version = "0.2.0"
edition = "2021"
authors = ["Sérgio Cardoso"]
description = "Local-first, safe CLI for cleaning and organizing files."
license = "Apache-2.0"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
trash = "5.2"
directories = "5.0"
thiserror = "1.0"
notify = "6"
libc = "0.2.189"
lofty = "0.25"
mp4 = "0.14"
kamadak-exif = "0.6.1"
lopdf = { version = "0.45.0", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
roxmltree = "0.21.1"

[dev-dependencies]
tempfile = "3.0"

[profile.dev]
incremental = true

[profile.release]
lto = true
